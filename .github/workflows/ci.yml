name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest tests/unit -q

  backend-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (migrations aplicadas)
        run: supabase start
      - uses: astral-sh/setup-uv@v6
      - name: Integration tests
        working-directory: backend
        run: uv sync --frozen && uv run pytest tests/integration -q
        env:
          CI: "true"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci
          NEXT_PUBLIC_SITE_URL: https://ci.example
      - name: robots.txt no usa localhost
        run: |
          set -euo pipefail
          mapfile -t files < <(find .next -type f \( -name 'robots.txt*' -o -name 'robots.body*' \) 2>/dev/null || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No se encontró artefacto de robots.txt bajo .next" >&2
            find .next -iname '*robot*' 2>/dev/null | head -50 >&2 || true
            exit 1
          fi
          for f in "${files[@]}"; do
            if grep -q localhost "$f"; then
              echo "localhost en $f" >&2
              exit 1
            fi
          done

  images:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, backend-integration, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: production
          push: true
          tags: ghcr.io/fabvargaspinto/rank-backend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          target: production
          push: true
          tags: ghcr.io/fabvargaspinto/rank-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
