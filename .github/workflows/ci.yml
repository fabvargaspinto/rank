name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribí push-production para aplicar migraciones a producción"
        required: true
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest tests/unit -q

  backend-integration:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start Supabase (migrations aplicadas)
        run: supabase start
      - uses: astral-sh/setup-uv@v6
      - name: Integration tests
        working-directory: backend
        run: uv sync --frozen && uv run pytest tests/integration -q
        env:
          CI: "true"

  frontend:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci
          NEXT_PUBLIC_SITE_URL: https://ci.example
      - name: robots.txt no usa localhost
        run: |
          set -euo pipefail
          mapfile -t files < <(find .next -type f \( -name 'robots.txt*' -o -name 'robots.body*' \) 2>/dev/null || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No se encontró artefacto de robots.txt bajo .next" >&2
            find .next -iname '*robot*' 2>/dev/null | head -50 >&2 || true
            exit 1
          fi
          for f in "${files[@]}"; do
            if grep -q localhost "$f"; then
              echo "localhost en $f" >&2
              exit 1
            fi
          done

  audit:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: npm (producción)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
      - uses: astral-sh/setup-uv@v6
      - name: PyPI (producción)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o /tmp/requirements.txt
          # PYSEC-2026-4146 (pyjwt) no tiene parche y solo afecta a quien reusa el dict de options
          uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip --ignore-vuln PYSEC-2026-4146

  images:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, backend-integration, frontend, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: production
          push: true
          tags: ghcr.io/fabvargaspinto/rank-backend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          target: production
          push: true
          tags: ghcr.io/fabvargaspinto/rank-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_HCAPTCHA_SITE_KEY=${{ vars.NEXT_PUBLIC_HCAPTCHA_SITE_KEY }}

  migrate-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Confirmar destino
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "push-production" ]; then
            echo "Abortado: confirm debe ser exactamente push-production" >&2
            exit 1
          fi
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_DB_PASSWORD}" ] || [ -z "${SUPABASE_PROJECT_ID}" ]; then
            echo "Faltan secrets del environment production: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Estado remoto vs local
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase migration list --linked
      - name: Aplicar migraciones
        run: supabase db push
