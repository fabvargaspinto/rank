<!DOCTYPE html>
<html lang="es">
  <body>
    <h2>Confirmá tu cuenta</h2>
    <p>Para empezar a usar Sello Nómada, abrí el enlace y tocá Confirmar email.</p>
    <p>

  </body>
</html>
