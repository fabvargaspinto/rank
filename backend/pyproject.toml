[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "python-dotenv>=1.2.3",
    "supabase>=2.31.0",
    "uuid6>=2025.0.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.4.2",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: tests aislados, sin Supabase ni red",
    "integration: tests contra Supabase local en Docker",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py313"
src = ["."]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "W",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"api/**" = ["B008"]
"controller/**" = ["B008"]
"tests/**" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["api", "config", "controller", "core", "db", "tests"]

[tool.mypy]
python_version = "3.13"
files = ["api", "config", "controller", "core", "db", "main.py"]
mypy_path = "."
explicit_package_bases = true
pretty = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "supabase.*",
    "postgrest.*",
    "uuid6",
]
ignore_missing_imports = true

