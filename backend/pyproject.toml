[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "python-dotenv>=1.2.3",
    "slowapi>=0.1.10",
    "supabase>=2.31.0",
    "uuid6>=2025.0.1",
]

[dependency-groups]
dev = [
    "import-linter>=2.5",
    "mypy>=2.3.1",
    "pytest>=8.4.2",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: tests aislados, sin Supabase ni red",
    "integration: tests contra Supabase local o SQLite/Turso de Instagram",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py313"
src = ["."]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "W",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"api/**" = ["B008"]
"tests/**" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["api", "config", "core", "tests"]

[tool.importlinter]
root_packages = ["core"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Capas dentro de cada contexto"
type = "layers"
containers = ["core.auth", "core.user", "core.post", "core.instagram"]
layers = ["infrastructure", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Domain y Application no dependen de frameworks"
type = "forbidden"
source_modules = [
    "core.auth.domain",
    "core.auth.application",
    "core.user.domain",
    "core.user.application",
    "core.post.domain",
    "core.post.application",
    "core.instagram.domain",
    "core.instagram.application",
    "core.shared.domain",
]
forbidden_modules = [
    "fastapi",
    "starlette",
    "pydantic_settings",
    "supabase",
    "postgrest",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "Contextos independientes: solo comparten core.shared"
type = "independence"
modules = ["core.auth", "core.user", "core.post", "core.instagram"]
ignore_imports = [
    # El aprovisionamiento crea Auth y User en la misma transacción.
    "core.auth.domain.auth_repo -> core.user.domain.user",
    "core.auth.application.provision_identity -> core.user.domain.user",
    "core.auth.infrastructure.auth_supabase_repo -> core.user.domain.user",
    "core.auth.infrastructure.auth_supabase_repo -> core.user.infrastructure.user_mapper",
    # Post resuelve el autor con el repositorio de user.
    "core.post.application.create_post -> core.user.domain.user",
    "core.post.application.get_posts_by_user -> core.user.application.application_error",
    "core.post.application.get_posts_by_user -> core.user.domain.user_repo",
    "core.post.application.delete_post -> core.user.domain.user",
    "core.user.application.get_public_profile -> core.post.application.get_posts_by_user",
    "core.user.application.get_public_profile -> core.post.domain.post",
    # Borrar la cuenta también borra la identidad.
    "core.user.application.delete_account -> core.auth.domain.auth_repo",
]

[tool.mypy]
python_version = "3.13"
files = ["api", "config", "core", "main.py"]
mypy_path = "."
explicit_package_bases = true
pretty = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "supabase.*",
    "postgrest.*",
    "uuid6",
]
ignore_missing_imports = true

