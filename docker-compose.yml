services:
  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      <<: *local-supabase-env
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    command:
      [
        "sh",
        "-c",
        "uv sync --frozen && if [ -f certs/localhost-cert.pem ] && [ -f certs/localhost-key.pem ]; then uvicorn main:app --host 0.0.0.0 --port 8000 --reload --ssl-certfile certs/localhost-cert.pem --ssl-keyfile certs/localhost-key.pem; else uvicorn main:app --host 0.0.0.0 --port 8000 --reload; fi",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import ssl, urllib.request; ctx=ssl._create_unverified_context(); urllib.request.urlopen('https://127.0.0.1:8000/health', context=ctx).read() if __import__('pathlib').Path('certs/localhost-cert.pem').exists() else urllib.request.urlopen('http://127.0.0.1:8000/health').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3000:3000"
    environment:
      <<: *local-supabase-env
      CI: "true"
      BACKEND_URL: ${BACKEND_URL:-https://backend:8000}
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command:
      ["sh", "-c", "pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  integration-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *local-supabase-env
      SUPABASE_DEVELOPMENT_URL: ${SUPABASE_DEVELOPMENT_URL:-}
      SUPABASE_DEVELOPMENT_SECRET_KEY: ${SUPABASE_DEVELOPMENT_SECRET_KEY:-}
      SUPABASE_DEVELOPMENT_ANON_KEY: ${SUPABASE_DEVELOPMENT_ANON_KEY:-}
      TURSO_DEVELOPMENT_URL: ${TURSO_DEVELOPMENT_URL:-${TURSO_DEVELOPMENT_DATABASE:-}}
      TURSO_DEVELOPMENT_TOKEN: ${TURSO_DEVELOPMENT_TOKEN:-}
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    command:
      [
        "sh",
        "-c",
        "uv sync --frozen && uv run pytest tests/integration -q",
      ]

volumes:
  backend_venv:
  frontend_node_modules:
