services:
  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    command:
      [
        "sh",
        "-c",
        "uv sync --frozen && uvicorn main:app --host 0.0.0.0 --port 8000 --reload",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3000:3000"
    environment:
      CI: "true"
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-${SUPABASE_URL}}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-${SUPABASE_ANON_KEY}}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command:
      ["sh", "-c", "pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  integration-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *local-supabase-env
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    command:
      [
        "sh",
        "-c",
        "uv sync --frozen && uv run pytest tests/integration -q",
      ]

volumes:
  backend_venv:
  frontend_node_modules:
